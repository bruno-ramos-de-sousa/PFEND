<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    #container {
      justify-self: center;
      width: 50%;
      height: 300px;
      background-color: pink;
    }
    h1 {
      text-align: center;
    }
    .principal {
      width: 150px;
      height: 150px;
      border-radius: 75px;
      justify-self: center;
      background-color: black;
    }
  </style>

  <script>
    function acao1(){
        alert('Evento de onclick')
        document.getElementById('principal').innerText = "globo";
    }
    function acao2() {
        alert('Evento de ondblclick')
        document.getElementById('principall').innerText = "globo2";
    }
  </script>
  <body>
    <section id="container">
      <h1>teste</h1>
      <div class="principal" id="principal" onclick="acao1()"></div>
      <br>
      <div class="principal" id="principall" ondblclick="acao2()"></div>
    </section>
  </body>
</html>
