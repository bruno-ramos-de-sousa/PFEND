<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <form action="#" onsubmit="return false;" class="card">
      <label for="valor">Valor da compra</label>
      <input type="number" id="valor" step="0.01" />

      <label for="escolha">Escolha a forma de pagamento</label>
      <select name="escolha" id="escolha">
        <option value="1">Pagamento a vista (5% de desconto)</option>
        <option value="2">Pagamento no débito</option>
        <option value="3">Pagamento no crédito</option>
        <option value="4">Pagamento com crediário</option>
      </select>

      <label for="parcelas" id="labelParcelas">Quantidade de parcelas</label>
      <select name="parcelas" id="parcelas"></select>
      <p id="valorPagar"></p>
    </form>
    <script src="script/script.js"></script>
  </body>
</html>
