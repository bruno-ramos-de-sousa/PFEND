    <script>
        var peso = prompt('Digite seu peso em kg:')
        var altura = prompt('Digite seu peso em m:')

        const imc = parseInt(peso) / parseFloat(altura)**2

        if (imc < 18.5) {
            document.write(`Seu imc é ${imc.toFixed(2)} você está abaixo do peso normal`)
        } else if (imc < 25) {
            document.write(`Seu imc é ${imc.toFixed(2)} você está com peso normal`)
        } else if (imc < 30) {
            document.write(`Seu imc é ${imc.toFixed(2)} você está com excesso de peso`)
        } else if (imc < 35) {
            document.write(`Seu imc é ${imc.toFixed(2)} você está na obesidade classe I`)
        } else if (imc < 40) {
            document.write(`Seu imc é ${imc.toFixed(2)} você está na obesidade classe II`)
        } else {
            document.write(`Seu imc é ${imc.toFixed(2)} você está na obesidade classe III`)
        }
    </script>
